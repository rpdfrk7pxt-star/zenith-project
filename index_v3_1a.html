<html lang="de">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Ferrari 812 GTS — Zenith</title>
<style>
:root{
  --bg:#0a0a0c; --panel:rgba(18,18,21,.82); --panel-solid:#121215;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --fg:#f2f2f4; --fg2:rgba(242,242,244,.62); --fg3:rgba(242,242,244,.38);
  --acc:#e0122a; --acc2:#ff2d46;
  --sheet-h:min(54vh,460px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  font-feature-settings:"tnum";overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0}
canvas{display:block;touch-action:none}

/* ---------- Ladebildschirm ---------- */
#loader{position:fixed;inset:0;z-index:100;background:#08080a;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .7s ease,visibility .7s}
#loader.gone{opacity:0;visibility:hidden}
#loader .brand{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--fg3)}
#loader .model{font-size:clamp(30px,8vw,52px);font-weight:200;letter-spacing:.16em}
#loader .model b{font-weight:600;color:var(--acc2)}
#bar{width:min(260px,62vw);height:2px;background:rgba(255,255,255,.10);overflow:hidden;border-radius:2px}
#barfill{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),#ff6a4d);
  transition:width .25s ease;box-shadow:0 0 14px rgba(224,18,42,.7)}
#pct{font-size:11px;letter-spacing:.3em;color:var(--fg3)}
#lderr{font-size:12px;color:#ff7a7a;max-width:80vw;text-align:center;line-height:1.5;padding:0 20px}

/* ---------- Kopfzeile ---------- */
#top{position:absolute;top:calc(var(--safe-t) + 10px);left:0;right:0;z-index:20;
  display:flex;align-items:flex-start;justify-content:space-between;padding:0 14px;
  pointer-events:none}
#title .k{font-size:9.5px;letter-spacing:.38em;color:var(--fg3);text-transform:uppercase}
#title .n{font-size:17px;font-weight:600;letter-spacing:.06em;margin-top:3px}
#tools{display:flex;gap:7px;pointer-events:auto}
.tbtn{width:38px;height:38px;border-radius:11px;background:var(--panel);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);display:grid;place-items:center;transition:.16s}
.tbtn:active{transform:scale(.9)}
.tbtn.on{background:var(--acc);border-color:var(--acc)}
.tbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- Ansichts-Leiste ---------- */
#views{position:absolute;left:0;right:0;bottom:calc(var(--sheet-h) + 10px);z-index:18;
  display:flex;gap:7px;padding:0 14px;overflow-x:auto;scrollbar-width:none;
  transition:bottom .34s cubic-bezier(.32,.72,0,1)}
#views::-webkit-scrollbar{display:none}
body.collapsed #views{bottom:calc(62px + var(--safe-b) + 10px)}
.vbtn{flex:0 0 auto;padding:7px 13px;border-radius:9px;background:var(--panel);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);
  font-size:11.5px;letter-spacing:.04em;color:var(--fg2);white-space:nowrap;transition:.16s}
.vbtn.on{background:#fff;color:#0a0a0c;border-color:#fff;font-weight:600}
.vbtn:active{transform:scale(.94)}

/* ---------- Teile-Hinweis ---------- */
#tip{position:absolute;z-index:19;left:50%;transform:translate(-50%,8px);
  bottom:calc(var(--sheet-h) + 56px);pointer-events:none;opacity:0;transition:.25s;
  background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line2);border-radius:12px;padding:10px 14px;max-width:min(320px,86vw)}
#tip.on{opacity:1;transform:translate(-50%,0)}
#tip .t{font-size:12.5px;font-weight:600;letter-spacing:.02em}
#tip .d{font-size:10.5px;color:var(--fg2);margin-top:4px;line-height:1.5}
body.collapsed #tip{bottom:calc(62px + var(--safe-b) + 56px)}

/* ---------- Hotspots ---------- */
#hotlayer{position:absolute;inset:0;z-index:17;display:none;pointer-events:none}
.hot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;
  display:grid;place-items:center;pointer-events:auto}
.hot .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.92);
  box-shadow:0 0 0 5px rgba(255,255,255,.18),0 2px 10px rgba(0,0,0,.5);
  animation:pulse 2.4s infinite ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 4px rgba(255,255,255,.28),0 2px 10px rgba(0,0,0,.5)}
  70%{box-shadow:0 0 0 13px rgba(255,255,255,0),0 2px 10px rgba(0,0,0,.5)}
  100%{box-shadow:0 0 0 4px rgba(255,255,255,0),0 2px 10px rgba(0,0,0,.5)}}

/* ---------- Trennlinie im Vergleich ---------- */
#split{position:absolute;left:50%;top:0;bottom:0;width:1px;z-index:16;display:none;
  background:rgba(255,255,255,.55);box-shadow:0 0 14px rgba(0,0,0,.6);pointer-events:none}
#split::before,#split::after{position:absolute;top:calc(var(--safe-t) + 62px);
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.75)}
#split::before{content:'aktuell';right:10px}
#split::after{content:'gemerkt';left:10px}

/* ---------- Bedienfeld ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:22;height:var(--sheet-h);
  background:var(--panel);backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;padding-bottom:var(--safe-b);
  transition:transform .34s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -22px 60px rgba(0,0,0,.6)}
body.collapsed #sheet{transform:translateY(calc(var(--sheet-h) - 62px - var(--safe-b)))}
#grip{height:22px;display:grid;place-items:center;flex:0 0 auto;cursor:pointer}
#grip i{width:34px;height:4px;border-radius:4px;background:var(--line2);display:block}
#tabs{display:flex;gap:4px;padding:0 10px 9px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:9px;font-size:12px;letter-spacing:.03em;
  color:var(--fg3);transition:.16s;white-space:nowrap}
.tab.on{background:rgba(255,255,255,.10);color:var(--fg);font-weight:600}
#pages{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:2px 14px 22px}
.page{display:none}.page.on{display:block}
.lbl{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--fg3);
  margin:15px 0 9px}
.lbl:first-child{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:9px}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.sw{position:relative;aspect-ratio:1;border-radius:11px;border:1px solid var(--line);
  overflow:hidden;transition:.16s}
.sw:active{transform:scale(.92)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
.chip{padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:12px;
  color:var(--fg2);transition:.16s;letter-spacing:.02em;white-space:nowrap}
.chip:active{transform:scale(.94)}
.chip.on{background:#fff;color:#0a0a0c;border-color:#fff;font-weight:600}
.tg{padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:12px;
  color:var(--fg2);transition:.16s;margin:2px 8px 2px 0}
.tg.on{background:#fff;color:#0a0a0c;border-color:#fff;font-weight:600}

/* ---------- Regler ---------- */
.slw{margin:10px 0 14px}
.slh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;
  font-size:12px;color:var(--fg2)}
.slv{font-size:11.5px;color:var(--fg);font-weight:600}
input.sl{width:100%;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;
  background:rgba(255,255,255,.16);outline:none}
input.sl::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}
input.sl::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}

/* ---------- Gas und Drehzahl ---------- */
.gas{width:100%;padding:18px 0;border-radius:14px;border:1px solid var(--line2);
  background:rgba(255,255,255,.04);font-size:13px;font-weight:600;letter-spacing:.06em;
  margin:6px 0 12px;transition:.12s;touch-action:none;user-select:none}
.gas.on{background:var(--acc);border-color:var(--acc);transform:scale(.985)}
.tach{margin-bottom:6px}
.tbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;width:0%;border-radius:6px;
  background:linear-gradient(90deg,#3ad07a,#f2c200 62%,#ff3b2f 88%);transition:width .06s linear}
.tnum{font-size:11px;color:var(--fg2);margin-top:6px;letter-spacing:.06em}

/* ---------- Tabellen ---------- */
table.spec{width:100%;border-collapse:collapse;font-size:12px}
table.spec td,table.spec th{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.055);
  text-align:left;vertical-align:baseline}
table.spec td:first-child{color:var(--fg3);font-size:11px;width:44%}
table.spec td.v{font-weight:600;font-size:12.5px}
table.cmp td{font-size:11.5px}
table.cmp td:first-child{width:36%}
table.cmp th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
table.cmp tr.hd th:first-child{width:36%}
.note{font-size:10.5px;color:var(--fg3);line-height:1.6;margin-top:12px}
.saved{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.srow{display:flex;gap:7px;align-items:center}
.srow .chip{flex:1;text-align:left}
.del{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  color:var(--fg3);font-size:16px;line-height:1}

#toast{position:fixed;left:50%;bottom:calc(var(--sheet-h) + 24px);transform:translate(-50%,10px);
  z-index:60;background:rgba(255,255,255,.96);color:#0a0a0c;font-size:12px;font-weight:600;
  padding:9px 18px;border-radius:11px;opacity:0;transition:.28s;pointer-events:none;
  max-width:88vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(min-width:860px){
  :root{--sheet-h:100%}
  #sheet{left:auto;right:0;top:0;width:368px;height:100%;border-radius:0;
    border-top:0;border-left:1px solid var(--line);padding-top:var(--safe-t)}
  body.collapsed #sheet{transform:translateX(100%)}
  #grip{display:none}
  #tabs{padding-top:16px;flex-wrap:wrap;overflow:visible}
  #views{bottom:22px;right:388px;left:0}
  body.collapsed #views{bottom:22px;right:20px}
  #top{right:auto;width:calc(100% - 388px)}
  #toast{bottom:32px;left:calc(50% - 184px)}
  #tip{bottom:78px;left:calc(50% - 184px)}
  body.collapsed #tip{bottom:78px}
}
</style>
</head>

const RAIN_N = 2600;
let rain = null;
function buildRain(){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(RAIN_N * 3);
  const spd = new Float32Array(RAIN_N);
  for (let i = 0; i < RAIN_N; i++){
    pos[i*3]   = (Math.random() - .5) * 26;
    pos[i*3+1] = Math.random() * 13;
    pos[i*3+2] = (Math.random() - .5) * 26;
    spd[i] = 9 + Math.random() * 9;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.userData.spd = spd;
  rain = new THREE.Points(g, new THREE.PointsMaterial({
    color:0xaecbe8, size:0.035, transparent:true, opacity:0.0,
    depthWrite:false, sizeAttenuation:true }));
  rain.frustumCulled = false;
  scene.add(rain);
}
function stepRain(dt){
  if (!rain) return;
  rain.material.opacity = S.rain * 0.62;
  rain.visible = S.rain > 0.01;
  if (!rain.visible) return;
  const p = rain.geometry.attributes.position.array;
  const spd = rain.geometry.userData.spd;
  const cx = camera.position.x, cz = camera.position.z;
  for (let i = 0; i < RAIN_N; i++){
    p[i*3+1] -= spd[i] * dt * (0.5 + S.rain);
    if (p[i*3+1] < 0){
      p[i*3+1] = 12 + Math.random() * 2;
      p[i*3]   = cx + (Math.random() - .5) * 26;
      p[i*3+2] = cz + (Math.random() - .5) * 26;
    }
  }
  rain.geometry.attributes.position.needsUpdate = true;
}

function hdrBox(w, h, d, x, y, z, rx, ry, rgb, intensity){
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(rgb), side: THREE.DoubleSide });
  m.color.multiplyScalar(intensity);
  m.toneMapped = false;
  const b = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  b.position.set(x, y, z);
  b.rotation.set(rx, ry, 0);
  return b;
}

function buildEnvScene(p){
  const s = new THREE.Scene();
  const bg = new THREE.Mesh(
    new THREE.SphereGeometry(60, 24, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms:{ a:{ value:new THREE.Color(p.top) }, b:{ value:new THREE.Color(p.bot) } },
      vertexShader:'varying vec3 v; void main(){ v = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
      fragmentShader:'uniform vec3 a,b; varying vec3 v; void main(){ float h = clamp(normalize(v).y*.5+.5,0.,1.); gl_FragColor = vec4(mix(b,a,pow(h,.8)),1.); }',
    }));
  s.add(bg);
  // Softboxen: zwei seitliche Flächen, ein Deckenstreifen, zwei Kanten hinten
  s.add(hdrBox(16, 7, 1,  -11, 5.0, 0,  0,  Math.PI/2, 0xffffff, p.si * 3.2));
  s.add(hdrBox(16, 7, 1,   11, 5.0, 0,  0, -Math.PI/2, 0xffffff, p.si * 2.4));
  s.add(hdrBox(22, 9, 1,    0, 11.5, 0, Math.PI/2, 0, 0xffffff, p.si * 2.8));
  s.add(hdrBox(10, 4, 1,   -5, 3.2, -13, 0, 0, 0xbcd0ff, p.si * 1.3));
  s.add(hdrBox(10, 4, 1,    6, 3.4,  13, 0, Math.PI, 0xffd9b0, p.si * 1.5));
  s.add(hdrBox(30, 30, 1,   0, -0.6, 0, -Math.PI/2, 0, p.bot, 0.55));
  return s;
}

function applyEnv(i){
  const p = ENVS[i][1];
  if (envRT) envRT.dispose();
  const es = buildEnvScene(p);
  envRT = pmrem.fromScene(es, 0.02);
  scene.environment = envRT.texture;

  bgUni.top.value.setHex(p.top);
  bgUni.bot.value.setHex(p.bot);

async function fetchModel(){
  let lastErr = null;
  for (const url of MODEL_SOURCES){
    try {
      const res = await fetch(url, { cache:'force-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const total = +res.headers.get('content-length') || 6.0e6;
      const reader = res.body && res.body.getReader ? res.body.getReader() : null;
      if (!reader) { setProgress(0.9); return await res.arrayBuffer(); }
      const chunks = []; let got = 0;
      for (;;){
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        setProgress(Math.min(got / total, 0.985));
      }
      const buf = new Uint8Array(got); let o = 0;
      for (const c of chunks){ buf.set(c, o); o += c.length; }
      setProgress(1);
      return buf.buffer;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('unbekannt');
}

function crinkleTexture(label){
  const w = 512, h = 256, cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.fillStyle = '#b0140c'; g.fillRect(0, 0, w, h);
  const img = g.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4){
    const n = (Math.random() - .5) * 26;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
  }
  g.putImageData(img, 0, 0);
  g.font = 'bold 74px Helvetica, Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(0,0,0,0.30)';
  g.fillText(label, w/2 + 3, h/2 + 4);
  g.fillStyle = '#f2e9dd';
  g.fillText(label, w/2, h/2);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* ======================================================= V12-Klang (Web Audio)
   Zündfrequenz eines Zwölfzylinder-Viertakters: sechs Zündungen je
   Kurbelwellenumdrehung, also f = U/min / 60 * 6.
   Leerlauf 1000/min -> 100 Hz, Begrenzer 8900/min -> 890 Hz.            */

const AUDIO = {
  ctx:null, ready:false, running:false,
  rpm:1000, targetRpm:1000, throttle:0, master:null,
  oscs:[], gains:[], noiseGain:null, noiseFilt:null, bodyFilt:null,
  vol:0.6, limiterBlink:0,
};
const IDLE_RPM = 1000, MAX_RPM = 8900;

function noiseBuffer(ctx, sec){
  const n = Math.floor(ctx.sampleRate * sec);
  const b = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;       // leicht rosa gefärbt
    d[i] = last * 3.2;
  }
  return b;
}

/* kurzer künstlicher Nachhall statt externer Impulsantwort */
function reverbBuffer(ctx, sec, decay){
  const n = Math.floor(ctx.sampleRate * sec);
  const b = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++){
    const d = b.getChannelData(c);
    for (let i = 0; i < n; i++){
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
    }
  }
  return b;
}

/* Oberton-Gewichte: ein V12 ist obertonreich, aber ohne die harten
   ungeraden Anteile eines V8-Kreuzkurbelmotors. */
const HARM = [
  [0.5,  0.16], [1,  1.00], [2,  0.62], [3,  0.40], [4,  0.26],
  [5,  0.17], [6,  0.20], [8,  0.11], [10, 0.07], [12, 0.05],
];

function audioInit(){
  if (AUDIO.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  AUDIO.ctx = ctx;

  const master = ctx.createGain();
  master.gain.value = 0;
  AUDIO.master = master;

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 24;
  comp.ratio.value = 7; comp.attack.value = 0.004; comp.release.value = 0.18;

  const conv = ctx.createConvolver();
  conv.buffer = reverbBuffer(ctx, 1.1, 2.6);
  const wet = ctx.createGain(); wet.gain.value = 0.16;
  const dry = ctx.createGain(); dry.gain.value = 0.92;

  master.connect(dry); dry.connect(comp);
  master.connect(conv); conv.connect(wet); wet.connect(comp);
  comp.connect(ctx.destination);

  /* Auspuffkörper: Resonanz im Mittenbereich */
  const body = ctx.createBiquadFilter();
  body.type = 'peaking'; body.frequency.value = 240; body.Q.value = 1.1; body.gain.value = 7;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 55;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 4200; lp.Q.value = 0.7;
  body.connect(hp); hp.connect(lp); lp.connect(master);
  AUDIO.bodyFilt = { body, lp };

  for (const [mult, amp] of HARM){
    const o = ctx.createOscillator();
    o.type = mult <= 1 ? 'sawtooth' : (mult % 2 ? 'square' : 'sawtooth');
    o.frequency.value = 100 * mult;
    const g = ctx.createGain();
    g.gain.value = amp * 0.10;
    o.connect(g); g.connect(body);
    o.start();
    AUDIO.oscs.push({ o, mult });
    AUDIO.gains.push({ g, amp });
  }

  /* Ansaug- und Abgasrauschen */
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, 3);
  src.loop = true;
  const nf = ctx.createBiquadFilter();
  nf.type = 'bandpass'; nf.frequency.value = 800; nf.Q.value = 0.85;
  const ng = ctx.createGain(); ng.gain.value = 0;
  src.connect(nf); nf.connect(ng); ng.connect(master);
  src.start();
  AUDIO.noiseGain = ng; AUDIO.noiseFilt = nf;

  AUDIO.ready = true;
}

async function audioStart(){
  audioInit();
  if (!AUDIO.ctx) { toast('Kein Audio möglich'); return; }
  if (AUDIO.ctx.state === 'suspended') await AUDIO.ctx.resume();
  AUDIO.running = true;
  AUDIO.rpm = 260;                     // Anlasser
  AUDIO.targetRpm = IDLE_RPM;
  const t = AUDIO.ctx.currentTime;
  AUDIO.master.gain.cancelScheduledValues(t);
  AUDIO.master.gain.setValueAtTime(0.0001, t);
  AUDIO.master.gain.exponentialRampToValueAtTime(Math.max(AUDIO.vol, 0.02), t + 0.5);
  /* kurzer Hochlauf nach dem Start, wie beim Anlassen */
  AUDIO.targetRpm = 2600;
  setTimeout(() => { if (AUDIO.running) AUDIO.targetRpm = IDLE_RPM; }, 900);
}

function audioStop(){
  AUDIO.running = false;
  if (!AUDIO.ctx) return;
  const t = AUDIO.ctx.currentTime;
  AUDIO.master.gain.cancelScheduledValues(t);
  AUDIO.master.gain.setValueAtTime(AUDIO.master.gain.value, t);
  AUDIO.master.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
}

function audioThrottle(v){ AUDIO.throttle = v; }

function audioStep(dt){
  if (!AUDIO.ready || !AUDIO.running) return;
  /* Drehzahlverlauf: unter Last zieht er hoch, ohne Gas fällt er ab */
  const want = IDLE_RPM + AUDIO.throttle * (MAX_RPM - IDLE_RPM);
  const rate = AUDIO.throttle > 0.02 ? 2.1 : 3.2;
  const load = 1 - (AUDIO.rpm / MAX_RPM) * 0.55;   // oben herum träger
  AUDIO.rpm += (want - AUDIO.rpm) * Math.min(dt * rate * load, 1);
  if (AUDIO.rpm > MAX_RPM - 60){
    AUDIO.rpm = MAX_RPM - 60 - Math.random() * 120;   // Begrenzer
    AUDIO.limiterBlink = 1;
  }
  AUDIO.limiterBlink = Math.max(0, AUDIO.limiterBlink - dt * 3);
  S.rpm = AUDIO.rpm / MAX_RPM;

  const f = AUDIO.rpm / 60 * 6;
  const ct = AUDIO.ctx.currentTime;
  const rough = 1 + (Math.random() - .5) * (AUDIO.rpm < 1400 ? 0.016 : 0.004);
  for (let i = 0; i < AUDIO.oscs.length; i++){
    const { o, mult } = AUDIO.oscs[i];
    o.frequency.setTargetAtTime(Math.min(f * mult * rough, 18000), ct, 0.02);
    /* mit steigender Drehzahl treten die hohen Ordnungen hervor */
    const lift = mult >= 4 ? (0.35 + S.rpm * 1.35) : (1.0 - S.rpm * 0.18);
    const th = 0.45 + AUDIO.throttle * 0.75;
    AUDIO.gains[i].g.gain.setTargetAtTime(
      AUDIO.gains[i].amp * 0.085 * lift * th, ct, 0.05);
  }
  AUDIO.noiseFilt.frequency.setTargetAtTime(420 + S.rpm * 2600, ct, 0.06);
  AUDIO.noiseGain.gain.setTargetAtTime(0.020 + AUDIO.throttle * 0.075 + S.rpm * 0.035, ct, 0.06);
  AUDIO.bodyFilt.lp.frequency.setTargetAtTime(2200 + S.rpm * 6500, ct, 0.08);
  AUDIO.bodyFilt.body.frequency.setTargetAtTime(180 + S.rpm * 420, ct, 0.08);
  AUDIO.master.gain.setTargetAtTime(AUDIO.vol, ct, 0.2);
}
/* ================================================================ Kamera */
let anim = null;
const _v = new THREE.Vector3();
const AXIS_Y = new THREE.Vector3(0, 1, 0);

function frameDistance(radius){
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  return radius / Math.sin(Math.min(vFov, hFov) / 2);
}

function viewPose(i){
  const v = VIEWS[i][1];
  if (v.fixed){
    return { pos:new THREE.Vector3(...v.fixed), tgt:new THREE.Vector3(...v.look), fov:v.fov };
  }
  if (v.engine){
    const d = frameDistance(0.55) * v.r;
    return { pos:new THREE.Vector3(Math.sin(v.az) * Math.cos(v.el),
                                   Math.sin(v.el), Math.cos(v.az) * Math.cos(v.el))
                    .multiplyScalar(d).add(new THREE.Vector3(0, 1.05, 0)),
             tgt:new THREE.Vector3(0, 1.05, 0), fov:32 };
  }
  const d = frameDistance(2.55) * v.r;
  const t = new THREE.Vector3(...v.t);
  const p = new THREE.Vector3(
    Math.sin(v.az) * Math.cos(v.el), Math.sin(v.el), Math.cos(v.az) * Math.cos(v.el)
  ).multiplyScalar(v.r < .6 ? d * 0.42 : d).add(t);
  return { pos:p, tgt:t, fov:32 };
}

function goView(i, instant){
  S.view = i;
  const eng = !!VIEWS[i][1].engine;
  setEngineMode(eng);
  const p = viewPose(i);
  if (instant){
    camera.position.copy(p.pos); controls.target.copy(p.tgt);
    camera.fov = p.fov; camera.updateProjectionMatrix();
    controls.update(); anim = null;
  } else {
    anim = { t:0, dur:1.15,
             p0:camera.position.clone(), p1:p.pos,
             t0:controls.target.clone(), t1:p.tgt,
             f0:camera.fov, f1:p.fov };
  }
  syncViewButtons();
}

function stepAnim(dt){
  if (!anim) return;
  anim.t = Math.min(anim.t + dt / anim.dur, 1);
  const e = anim.t < .5 ? 4*anim.t*anim.t*anim.t
                        : 1 - Math.pow(-2*anim.t + 2, 3) / 2;
  camera.position.lerpVectors(anim.p0, anim.p1, e);
  controls.target.lerpVectors(anim.t0, anim.t1, e);
  const f = anim.f0 + (anim.f1 - anim.f0) * e;
  if (Math.abs(camera.fov - f) > 1e-3){ camera.fov = f; camera.updateProjectionMatrix(); }
  if (anim.t >= 1) anim = null;
}

/* ---------------------------------------------------------- geführte Tour */
const TOUR = [0, 1, 2, 6, 7, 3, 4, 8, 9, 10, 5, 0];
let tour = null;
function tourToggle(){
  if (tour){ tour = null; toast('Tour beendet'); }
  else { tour = { i:0, wait:0 }; goView(TOUR[0]); toast('Geführte Tour läuft'); }
  syncButtons();
}
function stepTour(dt){
  if (!tour) return;
  tour.wait -= dt;
  if (!anim && tour.wait <= 0){
    tour.i++;
    if (tour.i >= TOUR.length){ tour = null; syncButtons(); toast('Tour beendet'); return; }
    goView(TOUR[tour.i]);
    tour.wait = 2.4;
  }
}

function stepHotspots(){
  const layer = document.getElementById('hotlayer');

  layer.style.display = on ? 'block' : 'none';

  for (const h of hotEls){

    h.el.style.left = ((_v.x * .5 + .5) * innerWidth) + 'px';

/* ------------------------------------------------------------ Fotoexport */
const RATIOS = [['Bildschirm', 0], ['16:9', 16/9], ['3:2', 3/2], ['1:1', 1], ['9:16', 9/16]];

function shoot(){
  const r = RATIOS[S.ratio] ? RATIOS[S.ratio][1] : 0;
  const base = Math.min(Math.max(innerWidth, innerHeight) * 2, 3200);
  let w, h;
  if (!r){ w = innerWidth * 2; h = innerHeight * 2; }
  else if (r >= 1){ w = base; h = Math.round(base / r); }
  else { h = base; w = Math.round(base * r); }
  w = Math.min(w, 3200); h = Math.min(h, 3200);

  const oldA = camera.aspect, oldPR = renderer.getPixelRatio();
  const size = new THREE.Vector2(); renderer.getSize(size);
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (S.dof && composer){ composer.setSize(w, h); composer.render(); }
  else renderer.render(scene, camera);

  const src = renderer.domElement;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.drawImage(src, 0, 0, w, h);
  if (S.mark){
    const pad = Math.round(h * 0.035);
    const fs = Math.max(14, Math.round(h * 0.024));
    g.font = '600 ' + fs + 'px Helvetica, Arial, sans-serif';
    g.textBaseline = 'bottom';
    g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = fs * 0.6;
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.fillText('812 GTS', pad, h - pad - fs * 1.25);
    g.font = '400 ' + Math.round(fs * 0.62) + 'px Helvetica, Arial, sans-serif';
    g.fillStyle = 'rgba(255,255,255,.62)';
    g.fillText(PAINTS[S.paint][0] + ' · ' + FINISHES[S.finish][0], pad, h - pad);
  }

  renderer.setPixelRatio(oldPR);
  renderer.setSize(size.x, size.y, false);
  if (composer) composer.setSize(size.x, size.y);
  camera.aspect = oldA; camera.updateProjectionMatrix();

  cv.toBlob(b => {
    if (!b){ toast('Foto fehlgeschlagen'); return; }
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url;
    a.download = '812GTS_' + PAINTS[S.paint][0].replace(/\s+/g,'') + '_' + Date.now() + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    toast('Foto gesichert (' + w + '×' + h + ')');
  }, 'image/png');
}

const el = (tag, cls, html) => {

const hex = v => '#' + v.toString(16).padStart(6, '0');

function swatchGrid(list, key, onPick, styleFn){

function slider(text, key, min, max, step, onInput, fmt){
  const wrap = el('div', 'slw');
  const head = el('div', 'slh');
  const name = el('span', null, text);
  const val = el('span', 'slv', fmt ? fmt(S[key]) : String(S[key]));
  head.append(name, val);
  const inp = el('input', 'sl');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step;
  inp.value = S[key];
  inp.addEventListener('input', () => {
    S[key] = +inp.value;
    val.textContent = fmt ? fmt(S[key]) : String(S[key]);
    onInput && onInput();
  });
  inp.addEventListener('change', pushURL);
  wrap.append(head, inp);
  wrap._set = v => { inp.value = v; val.textContent = fmt ? fmt(v) : String(v); };
  return wrap;
}

/* ------------------------------------------------- gespeicherte Konfigs */
const LSKEY = 'zenith812_v31';
function loadSaved(){
  try { return JSON.parse(localStorage.getItem(LSKEY) || '[]'); } catch (e) { return []; }
}
function storeSaved(a){
  try { localStorage.setItem(LSKEY, JSON.stringify(a.slice(0, 12))); } catch (e) {}
}
function saveConfig(){
  const name = prompt('Name der Konfiguration:', PAINTS[S.paint][0]);
  if (!name) return;
  const a = loadSaved();
  a.unshift({ name, cfg:snapConfig(), t:Date.now() });
  storeSaved(a); renderSaved(); toast('Gespeichert: ' + name);
}
function renderSaved(){
  const box = document.getElementById('savedList');
  if (!box) return;
  const a = loadSaved();
  box.innerHTML = '';
  if (!a.length){ box.append(el('div', 'note', 'Noch nichts gespeichert.')); return; }
  a.forEach((it, i) => {
    const row = el('div', 'srow');
    const b = el('button', 'chip', it.name);
    b.addEventListener('click', () => {
      pushConfig(it.cfg, true); syncUI(); pushURL(); toast('Geladen: ' + it.name);
    });
    const d = el('button', 'del', '×');
    d.addEventListener('click', () => {
      const arr = loadSaved(); arr.splice(i, 1); storeSaved(arr); renderSaved();
    });
    row.append(b, d); box.append(row);
  });
}

  syncUI(); pushURL(); toast(PAINTS[S.paint][0] + ' · ' + FINISHES[S.finish][0]);

async function shareLink(){

  if (pages[1]){
    const rows = pages[1].querySelectorAll('.chips');
    rows[0] && [...rows[0].children].forEach((c, j) => c.classList.toggle('on', j === S.rim));
    setSel('#pages .page:nth-child(2) .grid .sw', S.calliper);
    uiRef.ride && uiRef.ride._set(S.ride);
    uiRef.steer && uiRef.steer._set(S.steer);

  if (pages[2]){
    setSel('#pages .page:nth-child(3) .grid .sw', S.leather);
    uiRef.tint && uiRef.tint._set(S.tint);
  }
  if (pages[3]){
    const rows = pages[3].querySelectorAll('.chips');
    rows[0] && [...rows[0].children].forEach((c, j) => c.classList.toggle('on', j === S.env));
    rows[1] && [...rows[1].children].forEach((c, j) => c.classList.toggle('on', j === S.light));
    ['sun','lamp','rain','fog','reflect'].forEach(k => uiRef[k] && uiRef[k]._set(S[k]));
  }
  if (pages[4]){
    ['explode','xray','aperture'].forEach(k => uiRef[k] && uiRef[k]._set(S[k]));
  }
}

function syncButtons(){
  const bt = document.getElementById('bTour');
  if (bt) bt.classList.toggle('on', !!tour);
  const bc = document.getElementById('bCmp');
  if (bc) bc.classList.toggle('on', compareOn);
  const bs = document.getElementById('bSpin');
  if (bs) bs.classList.toggle('on', S.spin);
}

const toastEl = document.getElementById('toast');
let toastT = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('on'), 2100);
}

const tipEl = document.getElementById('tip');
let tipT = null;

  tipEl.querySelector('.d').textContent = desc;
  tipEl.classList.add('on');
  clearTimeout(tipT);

  [...box.children].forEach((c, i) => c.classList.toggle('on', i === S.view));

  VIEWS.forEach((v, i) => {
    const b = el('button', 'vbtn' + (i === 0 ? ' on' : ''), v[0]);

/* ========================================================= Tiefenschärfe */
let composer = null, bokeh = null;
async function ensureComposer(){
  if (composer) return composer;
  const [{ EffectComposer }, { RenderPass }, { BokehPass }, { OutputPass }] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/BokehPass.js'),
    import('three/addons/postprocessing/OutputPass.js'),
  ]);
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bokeh = new BokehPass(scene, camera, { focus:8, aperture:0.0008, maxblur:0.012 });
  composer.addPass(bokeh);
  composer.addPass(new OutputPass());
  composer.setSize(innerWidth, innerHeight);
  return composer;
}
function applyDof(){
  if (S.dof) ensureComposer().then(() => toast('Tiefenschärfe an'));
  else if (bokeh) toast('Tiefenschärfe aus');
}
function updateDof(){
  if (!bokeh) return;
  const d = camera.position.distanceTo(controls.target);
  bokeh.uniforms.focus.value = d;
  bokeh.uniforms.aperture.value = 0.00004 + S.aperture * 0.0022;
  bokeh.uniforms.maxblur.value = 0.004 + S.aperture * 0.016;
}

/* ------------------------------------------------------------ Spiegelung */
const _mNormal = new THREE.Vector3(), _mPlanePos = new THREE.Vector3();
const _mCamPos = new THREE.Vector3(), _mView = new THREE.Vector3();
const _mLook = new THREE.Vector3(), _mTarget = new THREE.Vector3();
const _mRot = new THREE.Matrix4();
function renderMirror(){
  if (S.reflect < 0.02 || V12.visible) return;
  const w = Math.max(2, Math.floor(innerWidth * 0.55));
  const h = Math.max(2, Math.floor(innerHeight * 0.55));
  if (mirrorRT.width !== w || mirrorRT.height !== h) mirrorRT.setSize(w, h);

  /* Spiegelkamera nach dem Verfahren von THREE.Reflector: Position und
     Blickziel an der Ebene y=0 spiegeln, up mitspiegeln. So bleibt die
     Orientierung eine echte Drehung und die Flächen werden nicht wegkulled. */
  mirror.updateMatrixWorld();
  camera.updateMatrixWorld();
  _mNormal.set(0, 0, 1).applyMatrix4(_mRot.extractRotation(mirror.matrixWorld));
  _mPlanePos.setFromMatrixPosition(mirror.matrixWorld);
  _mCamPos.setFromMatrixPosition(camera.matrixWorld);

  _mView.subVectors(_mPlanePos, _mCamPos).reflect(_mNormal).negate().add(_mPlanePos);
  _mRot.extractRotation(camera.matrixWorld);
  _mLook.set(0, 0, -1).applyMatrix4(_mRot).add(_mCamPos);
  _mTarget.subVectors(_mPlanePos, _mLook).reflect(_mNormal).negate().add(_mPlanePos);

  mirrorCam.position.copy(_mView);
  mirrorCam.up.set(0, 1, 0).applyMatrix4(_mRot).reflect(_mNormal);
  mirrorCam.lookAt(_mTarget);
  mirrorCam.near = camera.near; mirrorCam.far = camera.far;
  mirrorCam.updateMatrixWorld();
  mirrorCam.projectionMatrix.copy(camera.projectionMatrix);

  textureMatrix.set(0.5, 0, 0, 0.5,  0, 0.5, 0, 0.5,  0, 0, 0.5, 0.5,  0, 0, 0, 1);
  textureMatrix.multiply(mirrorCam.projectionMatrix);
  textureMatrix.multiply(mirrorCam.matrixWorldInverse);
  textureMatrix.multiply(mirror.matrixWorld);

  const vf = floor.visible, vm = mirror.visible, vc = contact.visible;
  const vr = rain ? rain.visible : false;
  floor.visible = mirror.visible = contact.visible = false;
  if (rain) rain.visible = false;

  const old = renderer.getRenderTarget();
  renderer.setRenderTarget(mirrorRT);
  renderer.clear();
  renderer.render(scene, mirrorCam);
  renderer.setRenderTarget(old);

  floor.visible = vf; mirror.visible = vm; contact.visible = vc;
  if (rain) rain.visible = vr;
}

/* ------------------------------------------------------ Vergleichsansicht */
const splitEl = document.getElementById('split');
function renderCompare(){
  const w = renderer.domElement.width, h = renderer.domElement.height;
  const half = Math.floor(w / 2);
  const cur = snapConfig();
  renderer.setScissorTest(true);
  renderer.setScissor(0, 0, half, h);
  renderer.setViewport(0, 0, w, h);
  renderer.render(scene, camera);
  pushConfig(compareB);
  renderer.setScissor(half, 0, w - half, h);
  renderer.render(scene, camera);
  pushConfig(cur);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, w, h);
}

/* ---------------------------------------------------------- Interaktion */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let down = null;

function pickAt(x, y){
  ndc.x = (x / innerWidth) * 2 - 1;
  ndc.y = -(y / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const list = Object.values(parts).filter(m => m.visible);
  const hits = ray.intersectObjects(list, false);
  return hits.length ? hits[0].object : null;
}

renderer.domElement.addEventListener('pointerdown', e => {
  down = { x:e.clientX, y:e.clientY, t:performance.now() };
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  const dt = performance.now() - down.t;
  down = null;
  if (dx*dx + dy*dy > 120 || dt > 500) return;      // war eine Drehbewegung
  const o = pickAt(e.clientX, e.clientY);
  if (!o) return;
  const n = o.userData.partName;
  if (n === 'doorLBody' || n === 'doorLInner' || n === 'doorLTrim' || n === 'doorLGlass' ||
      n === 'doorRBody' || n === 'doorRInner' || n === 'doorRTrim' || n === 'doorRGlass'){
    S.doors = S.doors ? 0 : 1;
    if (uiRef.doorBtn) uiRef.doorBtn.classList.toggle('on', !!S.doors);
    toast(S.doors ? 'Türen offen' : 'Türen zu');
    return;
  }
  if (n === 'hood'){
    S.hood = S.hood ? 0 : 1;
    if (uiRef.hoodBtn) uiRef.hoodBtn.classList.toggle('on', !!S.hood);
    toast(S.hood ? 'Haube offen' : 'Haube zu');
    return;
  }
  const info = PARTINFO[n];
  if (info) showTip(info[0], info[1]);
});

/* ------------------------------------------------------------- Kopfleiste */
document.getElementById('bSpin').addEventListener('click', () => {
  S.spin = !S.spin; syncButtons();
});
document.getElementById('bShot').addEventListener('click', shoot);
const toggleSheet = () => document.body.classList.toggle('collapsed');
document.getElementById('bSheet').addEventListener('click', toggleSheet);
document.getElementById('grip').addEventListener('click', toggleSheet);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});

/* ------------------------------------------------------------ Hauptschleife */
const clock = new THREE.Clock();
let turn = 0;

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  stepAnim(dt);
  stepTour(dt);
  applyDoors(dt);

  if (S.spin && !anim && carRoot){
    turn += dt * 0.28;
    carRoot.rotation.y = turn;
  }
  const speed = (S.spin ? 2.4 : 0) + S.rpm * 24;
  if (speed > 0.001) stepWheels(dt, speed);

  /* Studiolicht kreist */
  lamp.position.set(Math.sin(S.lampAz) * 6, 5.2, Math.cos(S.lampAz) * 6);

  stepRain(dt);
  stepV12(dt, t);
  audioStep(dt);
  stepHotspots();

  if (uiRef.tachBar){
    const r = AUDIO.running ? AUDIO.rpm : 0;
    uiRef.tachBar.style.width = (r / MAX_RPM * 100).toFixed(1) + '%';
    uiRef.tachBar.style.background = AUDIO.limiterBlink > 0 ? '#ff3b2f' : '';
    uiRef.tachNum.textContent = Math.round(r / 50) * 50 + ' /min';
  }

  controls.update();
  renderMirror();

  if (compareOn && compareB){
    renderCompare();
    splitEl.style.display = 'block';
  } else {
    splitEl.style.display = 'none';
    if (S.dof && composer){ updateDof(); composer.render(); }
    else renderer.render(scene, camera);
  }
}

/* ------------------------------------------------------------------ Start */
async function init(){
  buildViewButtons();
  buildHotspots();
  if (location.hash.startsWith('#c=')) decodeState(location.hash.slice(3));

  let buf;
  try { buf = await fetchModel(); }
  catch (e){
    lderr.textContent = 'Modell konnte nicht geladen werden: ' + e.message
      + ' — Datei ferrari_812_gts_v3_1a.glb im selben Ordner wie index_v3_1a.html prüfen.';
    return;
  }
  const loader = new GLTFLoader();
  loader.parse(buf, '', gltf => {
    const root = gltf.scene;
    root.traverse(o => {
      if (o.isMesh){
        o.castShadow = true; o.receiveShadow = true;
        o.userData.partName = o.name;
        parts[o.name] = o;
      } else if (o.isObject3D && o.name){
        groups[o.name] = o;
      }
    });
    carRoot = groups['Ferrari_812_GTS'] || root;
    scene.add(root);

    buildMaterials();
    setupExplode();
    buildUI();
    applyAll();
    syncUI();
    goView(S.view, true);

    document.getElementById('loader').classList.add('gone');
    setTimeout(() => document.getElementById('loader').remove(), 700);
    toast('Antippen erklärt Bauteile · Türen und Haube öffnen sich');
  }, err => {
    lderr.textContent = 'Modell fehlerhaft: ' + (err && err.message ? err.message : err);
  });
}

init();
loop();

if ('serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('sw_v3_1a.js').catch(() => {}));
}
