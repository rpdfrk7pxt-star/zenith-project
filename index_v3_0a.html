<title>Ferrari 812 GTS — Zenith</title>
<style>
:root{
  --bg:#0a0a0c; --panel:rgba(18,18,21,.82); --panel-solid:#121215;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --fg:#f2f2f4; --fg2:rgba(242,242,244,.62); --fg3:rgba(242,242,244,.38);
  --acc:#e0122a; --acc2:#ff2d46;
  --sheet-h:min(52vh,430px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  font-feature-settings:"tnum";overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0}
canvas{display:block;touch-action:none}

/* ---------- Ladebildschirm ---------- */
#loader{position:fixed;inset:0;z-index:100;background:#08080a;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .7s ease,visibility .7s}
#loader.gone{opacity:0;visibility:hidden}
#loader .brand{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--fg3)}
#loader .model{font-size:clamp(30px,8vw,52px);font-weight:200;letter-spacing:.16em}
#loader .model b{font-weight:600;color:var(--acc2)}
#bar{width:min(260px,62vw);height:2px;background:rgba(255,255,255,.10);overflow:hidden;border-radius:2px}
#barfill{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),#ff6a4d);
  transition:width .25s ease;box-shadow:0 0 14px rgba(224,18,42,.7)}
#pct{font-size:11px;letter-spacing:.3em;color:var(--fg3)}
#lderr{font-size:12px;color:#ff7a7a;max-width:80vw;text-align:center;line-height:1.5;display:none}

/* ---------- Kopfzeile ---------- */
#top{position:absolute;top:calc(var(--safe-t) + 10px);left:0;right:0;z-index:20;
  display:flex;align-items:flex-start;justify-content:space-between;padding:0 14px;
  pointer-events:none}
#title{pointer-events:none}
#title .k{font-size:9.5px;letter-spacing:.38em;color:var(--fg3);text-transform:uppercase}
#title .n{font-size:17px;font-weight:600;letter-spacing:.06em;margin-top:3px}
#title .v{font-size:10.5px;color:var(--fg2);margin-top:2px;letter-spacing:.04em}
#tools{display:flex;gap:7px;pointer-events:auto}
.tbtn{width:38px;height:38px;border-radius:11px;background:var(--panel);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);display:grid;place-items:center;transition:.16s}
.tbtn:active{transform:scale(.9)}
.tbtn.on{background:var(--acc);border-color:var(--acc)}
.tbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- Ansichts-Leiste ---------- */
#views{position:absolute;left:0;right:0;bottom:calc(var(--sheet-h) + 10px);z-index:18;
  display:flex;gap:7px;padding:0 14px;overflow-x:auto;scrollbar-width:none;
  transition:bottom .34s cubic-bezier(.32,.72,0,1)}
#views::-webkit-scrollbar{display:none}
body.collapsed #views{bottom:calc(62px + var(--safe-b) + 10px)}
.vbtn{flex:0 0 auto;padding:7px 13px;border-radius:9px;background:var(--panel);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);
  font-size:11.5px;letter-spacing:.04em;color:var(--fg2);white-space:nowrap;transition:.16s}
.vbtn.on{background:#fff;color:#0a0a0c;border-color:#fff;font-weight:600}
.vbtn:active{transform:scale(.94)}

/* ---------- Teile-Hinweis ---------- */
#tip{position:absolute;z-index:19;pointer-events:none;opacity:0;transition:opacity .25s;
  background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line2);border-radius:11px;padding:8px 12px;max-width:230px}
#tip.on{opacity:1}
#tip .t{font-size:12.5px;font-weight:600;letter-spacing:.02em}
#tip .d{font-size:10.5px;color:var(--fg2);margin-top:3px;line-height:1.45}

/* ---------- Bedienfeld ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:22;height:var(--sheet-h);
  background:var(--panel);backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);
  transition:transform .34s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -22px 60px rgba(0,0,0,.6)}
body.collapsed #sheet{transform:translateY(calc(var(--sheet-h) - 62px - var(--safe-b)))}
#grip{height:22px;display:grid;place-items:center;flex:0 0 auto;cursor:pointer}
#grip i{width:34px;height:4px;border-radius:4px;background:var(--line2);display:block}
#tabs{display:flex;gap:4px;padding:0 10px 9px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:9px;font-size:12px;letter-spacing:.03em;
  color:var(--fg3);transition:.16s;white-space:nowrap}
.tab.on{background:rgba(255,255,255,.10);color:var(--fg);font-weight:600}
#pages{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:2px 14px 18px}
.page{display:none}.page.on{display:block}
.lbl{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--fg3);
  margin:14px 0 9px}
.lbl:first-child{margin-top:4px}
.row{display:flex;gap:9px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:9px}

.sw{position:relative;aspect-ratio:1;border-radius:11px;border:1px solid var(--line);
  overflow:hidden;transition:.16s}
.sw:active{transform:scale(.92)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
.sw i{position:absolute;inset:0;display:block}
.sw u{position:absolute;left:0;right:0;bottom:0;font-size:7.5px;text-decoration:none;
  text-align:center;padding:2px 1px;background:rgba(0,0,0,.55);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:12px;
  color:var(--fg2);transition:.16s;letter-spacing:.02em}
.chip:active{transform:scale(.94)}
.chip.on{background:#fff;color:#0a0a0c;border-color:#fff;font-weight:600}

.sld{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.sld input{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;
  background:rgba(255,255,255,.16);outline:none}
.sld input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}
.sld input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.sld span{font-size:11px;color:var(--fg2);min-width:40px;text-align:right}

.spec{display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 0;border-bottom:1px solid rgba(255,255,255,.055)}
.spec:last-child{border-bottom:0}
.spec b{font-size:11px;font-weight:400;color:var(--fg3);letter-spacing:.02em}
.spec s{font-size:13.5px;font-weight:600;text-decoration:none;letter-spacing:.01em}
.note{font-size:10.5px;color:var(--fg3);line-height:1.6;margin-top:12px}

#toast{position:fixed;left:50%;bottom:calc(var(--sheet-h) + 24px);transform:translate(-50%,10px);
  z-index:60;background:rgba(255,255,255,.96);color:#0a0a0c;font-size:12px;font-weight:600;
  padding:9px 18px;border-radius:11px;opacity:0;transition:.28s;pointer-events:none;
  white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(min-width:860px){
  :root{--sheet-h:100%}
  #sheet{left:auto;right:0;top:0;width:352px;height:100%;border-radius:0;
    border-top:0;border-left:1px solid var(--line);padding-top:var(--safe-t)}
  body.collapsed #sheet{transform:translateX(calc(100% - 0px))}
  #grip{display:none}
  #tabs{padding-top:16px}
  #views{bottom:22px;right:372px;left:0}
  body.collapsed #views{bottom:22px;right:20px}
  #top{right:auto;width:calc(100% - 372px)}
  #toast{bottom:32px;left:calc(50% - 176px)}
}
</style>
</head>

  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, uniforms: bgUni,
    vertexShader: `varying vec3 vP; void main(){ vP = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP; uniform vec3 top; uniform vec3 bot;
      void main(){
        float h = clamp(vP.y / 90.0 * 0.5 + 0.5, 0.0, 1.0);
        h = pow(h, 0.85);
        vec3 c = mix(bot, top, h);
        float d = length(vec2(vP.x, vP.z)) / 90.0;
        c *= 1.0 - 0.18 * clamp(d, 0.0, 1.0);
        gl_FragColor = vec4(pow(max(c, 0.0), vec3(0.4545)), 1.0);

);

function contactTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128,128,4,128,128,126);
  grd.addColorStop(0,   'rgba(0,0,0,0.72)');
  grd.addColorStop(0.42,'rgba(0,0,0,0.40)');
  grd.addColorStop(0.72,'rgba(0,0,0,0.12)');
  grd.addColorStop(1,   'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(6.4, 3.0),
  new THREE.MeshBasicMaterial({ map:contactTexture(), transparent:true, depthWrite:false, opacity:.9 })
);

const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;

function hdrBox(w,h,d, x,y,z, rx,ry, rgb, intensity){
  const m = new THREE.MeshBasicMaterial();
  m.color.setRGB(rgb[0]*intensity, rgb[1]*intensity, rgb[2]*intensity);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z);
  mesh.rotation.set(rx||0, ry||0, 0);
  return mesh;
}

function buildEnvScene(p){
  const s = new THREE.Scene();
  const room = new THREE.Mesh(
    new THREE.BoxGeometry(30, 18, 30),
    new THREE.MeshBasicMaterial({ side:THREE.BackSide, color:p.room })
  );
  s.add(room);
  /* Deckenleisten — erzeugen die langen Reflexe auf der Karosserie */
  s.add(hdrBox(14, .3, 1.6,  0, 8.4,  3.4, 0,0, p.key,  p.keyI));
  s.add(hdrBox(14, .3, 1.6,  0, 8.4, -3.4, 0,0, p.key,  p.keyI*0.82));
  s.add(hdrBox(14, .3, 2.6,  0, 8.6,  0.0, 0,0, p.key,  p.keyI*0.55));
  /* Seitliche Softboxen */
  s.add(hdrBox(.3, 5.0, 11,  -9.5, 4.2, 0, 0,0, p.fill, p.fillI));
  s.add(hdrBox(.3, 5.0, 11,   9.5, 4.2, 0, 0,0, p.fill, p.fillI*1.25));
  /* Front-/Heckaufheller */
  s.add(hdrBox(9, 3.4, .3,  0, 3.2,  10.5, 0,0, p.fill, p.fillI*0.7));
  s.add(hdrBox(9, 3.4, .3,  0, 3.2, -10.5, 0,0, p.fill, p.fillI*0.55));
  /* Bodenbounce */
  s.add(hdrBox(20, .3, 20,  0, -1.2, 0, 0,0, [1,1,1], p.n==='Nacht' ? 0.05 : 0.30));
  /* Sonnen-/Keylight-Akzent */
  if (p.n === 'Sonnenuntergang')
    s.add(hdrBox(.3, 3.0, 7, -9.2, 2.2, 2, 0,0, [1,0.42,0.16], 16));
  if (p.n === 'Nacht'){
    s.add(hdrBox(.25, 2.4, 9, -9.4, 3.0, 0, 0,0, [0.55,0.72,1.0], 7));
    s.add(hdrBox(.25, 2.4, 9,  9.4, 3.0, 0, 0,0, [1.0,0.55,0.35], 4));
  }
  return s;
}

function applyEnv(i){
  const p = ENVS[i];
  if (envRT) envRT.dispose();
  const es = buildEnvScene(p);
  envRT = pmrem.fromScene(es, 0.035);
  scene.environment = envRT.texture;
  es.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  bgUni.top.value.setHex(p.bgTop);
  bgUni.bot.value.setHex(p.bgBot);
  renderer.toneMappingExposure = p.expo;
  floorMat.color.setHex(p.floor);
  floorMat.roughness = p.froughness;
  floorMat.needsUpdate = true;
  sun.color.setHex(p.sun);
  sun.intensity = p.sunI;
  contact.material.opacity = p.n === 'Showroom' ? 0.55 : 0.9;
}

const parts = {};                 // name -> Mesh
const M = {};                     // name -> Material

function setProgress(p){
  const v = Math.max(0, Math.min(100, Math.round(p)));
  barfill.style.width = v + '%';
  pctEl.textContent = v + ' %';
}

async function fetchModel(){
  let lastErr = null;
  for (const url of MODEL_SOURCES){
    try {
      const res = await fetch(url, { cache:'force-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const total = Number(res.headers.get('content-length')) || 0;
      if (!res.body || !total){
        const b = await res.arrayBuffer();
        setProgress(100);
        return b;
      }
      const reader = res.body.getReader();
      const chunks = []; let got = 0;
      for (;;){
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        setProgress(got / total * 96);
      }
      const buf = new Uint8Array(got); let o = 0;
      for (const c of chunks){ buf.set(c, o); o += c.length; }
      setProgress(97);
      return buf.buffer;
    } catch (e){ lastErr = e; }
  }
  throw lastErr || new Error('Modell nicht erreichbar');
}

function mkMat(opts){
  return new THREE.MeshPhysicalMaterial(Object.assign({
    color:0xffffff, metalness:0.5, roughness:0.5, envMapIntensity:1.0
  }, opts));
}

function buildMaterials(){
  /* Materialien werden komplett neu erzeugt - nie das geladene Material
     weiterverwenden (Sketchfab-Altlasten sind damit ausgeschlossen).
     Nur die Texturen werden uebernommen. */
  const tex = n => (parts[n] && parts[n].userData.map) || null;
  const t = n => { const m = tex(n); if (m){ m.colorSpace = THREE.SRGBColorSpace;
                   m.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); } return m; };

  M.body = mkMat({ clearcoat:1, clearcoatRoughness:.04, envMapIntensity:1.5 });
  M.trim = mkMat({ metalness:.35, roughness:.3, clearcoat:.6, clearcoatRoughness:.15 });
  M.underbody = mkMat({ color:0x07070a, metalness:.1, roughness:.9 });
  M.engine = mkMat({ map:t('engine'), color:0xb9bdc2, metalness:.85, roughness:.34 });
  M.interior = mkMat({ map:t('interior'), color:0x50525a, metalness:.15, roughness:.62 });
  M.interiorPattern = mkMat({ map:t('interiorPattern'), metalness:0, roughness:.72 });
  M.leather = mkMat({ metalness:0, roughness:.74, sheen:.35, sheenRoughness:.7 });
  M.seatbelt = mkMat({ color:0x1a1a1d, metalness:0, roughness:.88 });
  M.rim = mkMat({ envMapIntensity:1.6 });
  M.brake = mkMat({ map:t('brake'), color:0x9aa0a6, metalness:.82, roughness:.36 });
  M.tyre = mkMat({ map:t('tyre'), color:0x4a4a4c, metalness:0, roughness:.95 });
  M.calliper = mkMat({ metalness:.35, roughness:.22, clearcoat:.8, clearcoatRoughness:.1 });
  M.glass = mkMat({ color:0x0a0c0e, metalness:0, roughness:.03, transparent:true,
                    opacity:.5, envMapIntensity:2.4, side:THREE.DoubleSide, depthWrite:false });
  M.glassInner = mkMat({ color:0x0a0c0e, metalness:0, roughness:.05, transparent:true,
                    opacity:.3, envMapIntensity:1.6, side:THREE.DoubleSide, depthWrite:false });
  M.lensFront = mkMat({ color:0xdfe6ee, metalness:.05, roughness:.02, transparent:true,
                    opacity:.38, envMapIntensity:3.0, side:THREE.DoubleSide, depthWrite:false });
  M.lensRear = mkMat({ color:0x8c0d0d, metalness:.05, roughness:.05, transparent:true,
                    opacity:.55, envMapIntensity:2.4, side:THREE.DoubleSide, depthWrite:false });
  M.lightFront = mkMat({ map:t('lightFront'), color:0xdfe3e8, metalness:.75, roughness:.14 });
  M.lightRear = mkMat({ map:t('lightRear'), color:0x8e1512, metalness:.45, roughness:.2 });
  M.glowFront = mkMat({ color:0xfff6e8, metalness:0, roughness:.4,
                    emissive:0xfff2dc, emissiveIntensity:0 });
  M.glowRear = mkMat({ color:0x8c1008, metalness:0, roughness:.4,
                    emissive:0xff2411, emissiveIntensity:0 });
  M.badge = mkMat({ map:t('badge'), metalness:.4, roughness:.18, clearcoat:1, clearcoatRoughness:.05 });
  M.plate = mkMat({ color:0xe8e8e4, metalness:0, roughness:.5 });
  M.plateText = mkMat({ map:t('plateText'), color:0xd8dade, metalness:.3, roughness:.4 });
  for (let g = 1; g <= 7; g++)
    M['grille'+g] = mkMat({ map:t('grille'+g), color:0x121214, metalness:.4, roughness:.72,
                            side:THREE.DoubleSide });

  for (const k in parts){
    const mat = M[k];
    if (!mat) continue;
    parts[k].material = mat;
    const transparent = ['glass','glassInner','lensFront','lensRear'].includes(k);
    parts[k].castShadow = !transparent;
    parts[k].receiveShadow = !transparent;
    if (transparent) parts[k].renderOrder = 4;
  }
}

/* ---------------------------- Konfiguration anwenden -------------------- */
function applyPaint(){
  const c = new THREE.Color(PAINTS[S.paint][1]);
  const f = FINISHES[S.finish][1];
  M.body.color.copy(c);
  Object.assign(M.body, f);
  M.body.needsUpdate = true;
  const tr = TRIMS[S.trim];
  M.trim.color.set(tr[1] === null ? PAINTS[S.paint][1] : tr[1]);
  M.trim.metalness = tr[2]; M.trim.roughness = tr[3];
  M.trim.clearcoat = tr[0] === 'Karbon' ? 1 : .6;
  M.trim.clearcoatRoughness = tr[0] === 'Karbon' ? .08 : .15;
  M.trim.needsUpdate = true;
}
function applyRim(){
  const r = RIMS[S.rim];
  M.rim.color.setHex(r[1]); M.rim.metalness = r[2]; M.rim.roughness = r[3];
  M.rim.clearcoat = r[0] === 'Poliert' ? 1 : .3;
  M.rim.needsUpdate = true;
}
function applyCalliper(){ M.calliper.color.setHex(CALLIPERS[S.calliper][1]); M.calliper.needsUpdate = true; }
function applyLeather(){
  const c = new THREE.Color(LEATHERS[S.leather][1]);
  M.leather.color.copy(c);
  M.interiorPattern.color.copy(c).multiplyScalar(0.85);
  M.seatbelt.color.copy(c).multiplyScalar(0.55).lerp(new THREE.Color(0x151517), .45);
  M.leather.needsUpdate = M.interiorPattern.needsUpdate = true;
}
function applyTint(){
  const k = S.tint / 100;
  M.glass.opacity = 0.16 + k * 0.78;
  M.glass.color.setRGB(0.10 - 0.085*k, 0.115 - 0.098*k, 0.13 - 0.11*k);
  M.glassInner.opacity = 0.10 + k * 0.45;
  M.glassInner.color.copy(M.glass.color);
}
function applyLight(){
  const m = S.light;
  const fi = m === 0 ? 0 : (m === 1 ? 0.45 : 3.4);
  const ri = m === 0 ? 0 : (m === 1 ? 0.8  : 2.6);
  M.glowFront.emissiveIntensity = fi;
  M.glowRear.emissiveIntensity = ri;
  M.lensFront.opacity = m === 0 ? 0.38 : 0.26;
  M.lensRear.opacity  = m === 0 ? 0.55 : 0.42;
  glowLampF.intensity = m === 0 ? 0 : (m === 1 ? 0.6 : 3.2);
  glowLampR.intensity = m === 0 ? 0 : (m === 1 ? 0.5 : 1.8);
}
function applyAll(){
  applyPaint(); applyRim(); applyCalliper(); applyLeather(); applyTint(); applyLight();
  document.getElementById('cfgline').textContent =
    PAINTS[S.paint][0] + ' · ' + FINISHES[S.finish][0] + ' · ' + RIMS[S.rim][0];
  history.replaceState(null, '', '#c=' + encodeState());
}

/* ------------------------------ Kamerafahrten --------------------------- */
let anim = null;
const _v = new THREE.Vector3();

function frameDistance(radius){
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2;
  const hf = Math.atan(Math.tan(vf) * camera.aspect);
  return radius / Math.sin(Math.max(0.08, Math.min(vf, hf)));
}
function viewPose(i){
  const v = VIEWS[i];
  if (v.fixed) return { pos:new THREE.Vector3(...v.fixed.pos), tgt:new THREE.Vector3(...v.fixed.tgt) };
  const tgt = new THREE.Vector3(...v.tgt);
  const dir = new THREE.Vector3(...v.dir).normalize();
  const pos = tgt.clone().addScaledVector(dir, frameDistance(v.r));
  if (!v.dir[1] || v.dir[1] < 0.9) pos.y = Math.max(pos.y, 0.22);
  return { pos, tgt };
}
function goView(i, instant){
  S.view = i;
  document.querySelectorAll('.vbtn').forEach((b,k) => b.classList.toggle('on', k === i));
  const p = viewPose(i);
  controls.minDistance = VIEWS[i].fixed ? 0.05 : 0.45;
  if (instant){
    camera.position.copy(p.pos); controls.target.copy(p.tgt); controls.update(); anim = null; return;
  }
  anim = { t:0, dur:0.95,
    p0:camera.position.clone(), p1:p.pos,
    t0:controls.target.clone(),  t1:p.tgt };
}
function stepAnim(dt){
  if (!anim) return;
  anim.t = Math.min(1, anim.t + dt / anim.dur);
  const e = anim.t < .5 ? 4*anim.t**3 : 1 - Math.pow(-2*anim.t + 2, 3) / 2;
  camera.position.lerpVectors(anim.p0, anim.p1, e);
  controls.target.lerpVectors(anim.t0, anim.t1, e);
  if (anim.t >= 1) anim = null;
}

const el = (tag, cls, html) => { const n = document.createElement(tag);
  if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const hex = v => '#' + v.toString(16).padStart(6,'0');

function swatchGrid(list, key, onPick, styleFn){
  const g = el('div','grid');
  list.forEach((item, i) => {
    const b = el('button','sw' + (S[key] === i ? ' on' : ''));
    b.innerHTML = '<i style="' + styleFn(item) + '"></i><u>' + item[0] + '</u>';
    b.onclick = () => {
      S[key] = i;
      g.querySelectorAll('.sw').forEach((x,k) => x.classList.toggle('on', k === i));
      onPick(); applyAll();
    };
    g.appendChild(b);
  });
  return g;
}
function chipRow(list, key, onPick){
  const r = el('div','row');
  list.forEach((item, i) => {
    const b = el('button','chip' + (S[key] === i ? ' on' : ''), Array.isArray(item) ? item[0] : item);
    b.onclick = () => {
      S[key] = i;
      r.querySelectorAll('.chip').forEach((x,k) => x.classList.toggle('on', k === i));
      onPick(); applyAll();
    };
    r.appendChild(b);
  });
  return r;
}

document.getElementById('bShot').onclick = () => {
  const dpr = renderer.getPixelRatio();
  const w = renderer.domElement.width, h = renderer.domElement.height;
  const scale = Math.max(1, Math.min(2, 3200 / Math.max(w, h)));
  const restore = () => {
    renderer.setPixelRatio(dpr);
    renderer.setSize(innerWidth, innerHeight, false);
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  };
  try {
    if (scale > 1.02){
      renderer.setPixelRatio(dpr * scale);
      renderer.setSize(innerWidth, innerHeight, false);
      camera.updateProjectionMatrix();
    }
    renderer.render(scene, camera);
    renderer.domElement.toBlob(b => {
      if (!b){ restore(); toast('Foto fehlgeschlagen'); return; }
      const a = document.createElement('a');
      const url = URL.createObjectURL(b);
      a.href = url;
      a.download = '812GTS_' + PAINTS[S.paint][0].replace(/\s+/g,'') + '_' +
                   new Date().toISOString().slice(0,19).replace(/[:T-]/g,'') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      restore();
      toast('Foto gespeichert');
    }, 'image/png');
  } catch (e){ restore(); toast('Foto fehlgeschlagen'); }
};

document.getElementById('bShare').onclick = async () => {
  const url = location.origin + location.pathname + '#c=' + encodeState();
  const txt = 'Ferrari 812 GTS — ' + PAINTS[S.paint][0] + ', ' + RIMS[S.rim][0];
  try {
    if (navigator.share){ await navigator.share({ title:'812 GTS', text:txt, url }); return; }
    await navigator.clipboard.writeText(url);
    toast('Link kopiert');
  } catch (e){ toast('Link: ' + url.slice(0, 40) + '…'); }
};

/* ------------------------- Bedienfeld auf-/zuklappen -------------------- */
document.getElementById('grip').onclick = () => document.body.classList.toggle('collapsed');

/* ----------------------------- Teile antippen --------------------------- */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tipEl = document.getElementById('tip');
let tipT = null, down = null;

renderer.domElement.addEventListener('pointerdown', e => {
  down = { x:e.clientX, y:e.clientY, t:performance.now() };
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const held  = performance.now() - down.t;
  down = null;
  if (moved > 9 || held > 420) return;
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(Object.values(parts), false);
  if (!hits.length){ tipEl.classList.remove('on'); return; }
  const info = PARTINFO[hits[0].object.name];
  if (!info){ tipEl.classList.remove('on'); return; }
  tipEl.querySelector('.t').textContent = info[0];
  tipEl.querySelector('.d').textContent = info[1];
  tipEl.classList.add('on');
  const r = tipEl.getBoundingClientRect();
  tipEl.style.left = Math.max(10, Math.min(innerWidth - r.width - 10, e.clientX - r.width/2)) + 'px';
  tipEl.style.top  = Math.max(10, e.clientY - r.height - 16) + 'px';
  clearTimeout(tipT); tipT = setTimeout(() => tipEl.classList.remove('on'), 4200);
});

/* --------------------------------- Lauf --------------------------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (!anim && !VIEWS[S.view].fixed) goView(S.view, true);
});

const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.1);
  stepAnim(dt);
  if (S.spin && !anim){
    const off = camera.position.clone().sub(controls.target);
    const a = dt * 0.22;
    const ca = Math.cos(a), sa = Math.sin(a);
    camera.position.set(
      controls.target.x + off.x*ca - off.z*sa,
      camera.position.y,
      controls.target.z + off.x*sa + off.z*ca
    );
  }
  controls.update();
  renderer.render(scene, camera);
}

/* --------------------------------- Start -------------------------------- */
(async function start(){
  try {
    applyEnv(S.env);
    const buf = await fetchModel();
    const loader = new GLTFLoader();
    const gltf = await loader.parseAsync(buf, '');
    setProgress(99);

    const root = gltf.scene;
    root.traverse(o => {
      if (!o.isMesh) return;
      o.userData.map = o.material && o.material.map ? o.material.map : null;
      o.frustumCulled = true;
      parts[o.name] = o;
    });
    const found = Object.keys(parts).length;
    if (found < 20) throw new Error('Modell unvollständig: nur ' + found + ' Bauteile');

    buildMaterials();
    scene.add(root);

    /* Kontaktschatten an die tatsaechliche Fahrzeuggrundflaeche anpassen */
    const bb = new THREE.Box3().setFromObject(root);
    contact.scale.set((bb.max.x - bb.min.x) / 6.4 * 1.55,
                      (bb.max.z - bb.min.z) / 3.0 * 1.12, 1);

    buildUI();
    applyAll();
    syncSpin();
    goView(0, true);
    loop();

    setProgress(100);
    setTimeout(() => document.getElementById('loader').classList.add('gone'), 260);
  } catch (err){
    console.error(err);
    lderr.style.display = 'block';
    lderr.textContent = 'Modell konnte nicht geladen werden: ' + (err && err.message ? err.message : err) +
      ' — Datei ferrari_812_gts_v3_0a.glb im selben Ordner wie index_v3_0a.html prüfen.';
    pctEl.textContent = 'Fehler';
  }
})();

/* ------------------------------ Service Worker -------------------------- */
if ('serviceWorker' in navigator){
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw_v3_0a.js').catch(() => {});
  });
}

</script>
